<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create a new Trip</title>
</head>
<body>

    <div class="app-container">

        <header class="navbar">
            <h1>GlobalTrotter</h1>
            <img src="logo.png" alt="Profile/Logo" class="logo-icon">
        </header>

        <hr>

        <main>
            <section class="trip-form-section">
                <h2>Plan a new trip</h2>
                
                <form>
                    <div class="form-group">
                        <label for="trip-name">Trip Name:</label>
                        <input type="text" id="trip-name" name="tripName">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="place">Select a Place :</label>
                        <input type="text" id="place" name="place">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="start-date">Start Date:</label>
                        <input type="date" id="start-date" name="startDate">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="end-date">End Date:</label>
                        <input type="date" id="end-date" name="endDate">
                    </div>
                </form>
            </section>

            <hr>

            <section class="suggestions-section">
                <h3>Suggestion for Places to Visit/Activities to perform</h3>
                
                <ul class="suggestions-grid" style="list-style-type: none; padding: 0;">
                    <li class="suggestion-card">
                        <h4>Suggestion 1</h4>
                        <img src="suggestion1.png" alt="Suggestion 1">
                    </li>
                    <li class="suggestion-card">
                        <h4>Suggestion 2</h4>
                        <img src="suggestion2.png" alt="Suggestion 2">
                    </li>
                    <li class="suggestion-card">
                        <h4>Suggestion 3</h4>
                        <img src="suggestion3.png" alt="Suggestion 3">
                    </li>
                    <li class="suggestion-card">
                        <h4>Suggestion 4</h4>
                        <img src="suggestion4.png" alt="Suggestion 4">
                    </li>
                    <li class="suggestion-card">
                        <h4>Suggestion 5</h4>
                        <img src="suggestion5.png" alt="Suggestion 5">
                    </li>
                    <li class="suggestion-card">
                        <h4>Suggestion 6</h4>
                        <img src="suggestion6.png" alt="Suggestion 6">
                    </li>
                </ul>
            </section>
        </main>

    </div>

</body>
</html>
