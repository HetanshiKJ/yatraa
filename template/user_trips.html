<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatraa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
  <link rel="stylesheet" href="../static/css/style.css">
  <script src="../static/js/layout.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<main>
  <section class="screen">

    <div class="page-title">
      <div>
        <h1>Indian Itinerary & Budget</h1>
        <p>Plan Indian activities and track your trip expenses in INR.</p>
      </div>
      <button onclick="location.href='screen8.html'">+ Add Activity</button>
    </div>

    <div class="trip-summary">
      <div>
        <strong>Trip</strong>
        <span>Rajasthan Heritage</span>
      </div>
      <div>
        <strong>Dates</strong>
        <span>10 Oct – 16 Oct 2026</span>
      </div>
      <div>
        <strong>Destination</strong>
        <span>Jaipur</span>
      </div>
    </div>

    <div id="itineraryDays" class="itinerary-days"></div>

    <div class="budget-card">
      <div class="budget-header">
        <div>
          <span class="screen-number">BUDGET</span>
          <h2>Trip Budget</h2>
        </div>
        <strong id="totalBudget">₹0</strong>
      </div>

      <div class="budget-grid">
        <div class="budget-item">
          <span>Transport</span>
          <strong id="transportCost">₹0</strong>
        </div>

        <div class="budget-item">
          <span>Accommodation</span>
          <strong id="accommodationCost">₹0</strong>
        </div>

        <div class="budget-item">
          <span>Activities</span>
          <strong id="activityCost">₹0</strong>
        </div>

        <div class="budget-item">
          <span>Meals</span>
          <strong id="mealCost">₹0</strong>
        </div>
      </div>

      <div class="budget-progress">
        <div class="budget-progress-label">
          <span>Budget usage</span>
          <span id="budgetPercentage">0%</span>
        </div>
        <progress id="budgetProgress" value="0" max="100"></progress>
      </div>
    </div>

  </section>
</main>

<div id="footer-placeholder"></div>

<script src="data.js"></script>
<script src="screen9.js"></script>
</body>
</html>
