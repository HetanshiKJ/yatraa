<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yatraa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">🌍 <strong>Yatraa</strong></div>
  <nav>
    <button onclick="location.href='screen7.html'">Profile</button>
    <button onclick="location.href='screen8.html'">Explore</button>
    <button onclick="location.href='screen9.html'">Itinerary</button>
  </nav>
</header>

<main>
  <section class="screen">
    <div class="page-title">
      <div>
        <h1>User Profile</h1>
        <p>Manage your profile and explore trips across India.</p>
      </div>
      <button onclick="location.href='screen8.html'">Explore Indian Destinations →</button>
    </div>

    <div class="profile-container">
      <div class="profile-image-card">
        <div class="avatar" id="profileAvatar">JD</div>
        <!-- <input type="file" id="profileImageInput" accept="image/*"> -->
      </div>

      <div class="profile-details">
        <h2>User Details</h2>

        <form id="profileForm">
          <label for="profileName">Name</label>
          <input id="profileName" value="Aarav Sharma" required>

          <label for="profileEmail">Email</label>
          <input id="profileEmail" type="email" value="aarav@example.com" required>

          <label for="profileLanguage">Language</label>
          <select id="profileLanguage">
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
          </select>

          <label for="profileCurrency">Currency</label>
          <select id="profileCurrency">
            <option>INR</option>
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
          </select>

          <label for="profileTimezone">Timezone</label>
          <select id="profileTimezone">
            <option value="Asia/Kolkata">India Standard Time (IST)</option>
          </select>

          <div class="form-actions">
            <button class="primary-btn" type="submit">Save Changes</button>
            <button class="danger-btn" type="button" id="deleteAccount">Delete Account</button>
          </div>
        </form>

        <p id="profileMessage" class="success-message"></p>
      </div>
    </div>

    <section class="trip-section">
      <div class="section-heading">
        <h2>Preplanned Trips</h2>
        <button onclick="location.href='screen9.html'">View Itinerary</button>
      </div>
      <div class="trip-grid" id="preplannedTrips"></div>
    </section>

    <section class="trip-section">
      <div class="section-heading">
        <h2>Previous Trips</h2>
      </div>
      <div class="trip-grid" id="previousTrips"></div>
    </section>
  </section>
</main>

<footer>Yatraa India © 2026</footer>

<script src="data.js"></script>
<script src="screen7.js"></script>
</body>
</html>
